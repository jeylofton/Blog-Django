{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    Log In
{% endblock %}

{% block content %}
    <h1>Log In</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Log In" class="btn btn-success">
    </form>
    <p>If you forget your password <a href="{% url 'password_reset' %}">Click here.</a></p>

{% endblock %}

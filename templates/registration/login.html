{% extends 'base.html' %}

{% block title %}
    Log In
{% endblock %}

{% block content %}
    <h1>Log In</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p}}
        <input type="submit" value="Log In" class="btn btn-success">
    </form>
    <p>If you forget your password <a href="#">Click here.</a></p>

{% endblock %}
